name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  validate-docker-stack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Compile Python sources
        run: python -m compileall api_heart.py heart_model_wrapper.py train_model.py

      - name: Build Docker image
        run: docker build -t heart-disease-api:ci .

      - name: Start application container
        run: docker run -d --name heart-disease-api-ci -p 8000:8000 heart-disease-api:ci

      - name: Wait for health endpoint
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs heart-disease-api-ci
          exit 1

      - name: Check metrics endpoint
        run: curl -fsS http://127.0.0.1:8000/metrics >/dev/null

      - name: Collect logs on failure
        if: failure()
        run: docker logs heart-disease-api-ci

      - name: Stop container
        if: always()
        run: docker rm -f heart-disease-api-ci
