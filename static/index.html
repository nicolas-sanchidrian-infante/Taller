<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Heart Disease API - UI</title>
    <style>
      :root{--bg:#0f1720;--card:#0b1220;--muted:#9aa4b2;--accent:#4f46e5;--success:#10b981}
      *{box-sizing:border-box}
      body{font-family:Inter,Arial,sans-serif;background:var(--bg);color:#e6eef6;margin:0;padding:20px}
      .container{max-width:1000px;margin:0 auto}
      header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
      h1{font-size:18px;margin:0}
      .grid{display:grid;grid-template-columns:1fr 360px;gap:16px}
      .card{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));padding:16px;border-radius:8px;border:1px solid rgba(255,255,255,0.03)}
      label{display:block;font-size:13px;color:var(--muted);margin-top:8px}
      input,select{width:100%;padding:8px;margin-top:6px;border-radius:6px;border:1px solid rgba(255,255,255,0.04);background:transparent;color:inherit}
      .row{display:flex;gap:12px}
      .col{flex:1}
      button{background:var(--accent);color:white;border:none;padding:10px 12px;border-radius:8px;cursor:pointer}
      button.secondary{background:transparent;border:1px solid rgba(255,255,255,0.06)}
      pre{background:#07111a;padding:12px;border-radius:6px;overflow:auto;color:#cfe6ff}
      table{width:100%;border-collapse:collapse;font-size:13px}
      th,td{padding:8px;text-align:left;border-bottom:1px solid rgba(255,255,255,0.03)}
      .muted{color:var(--muted);font-size:13px}
      .controls{display:flex;gap:8px;align-items:center;margin-top:12px}
      .small{font-size:12px;padding:6px 8px}
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Heart Disease — Interfaz</h1>
        <div class="muted">API: <a href="/docs" style="color:inherit">/docs</a> · Metrics: <a href="/metrics" style="color:inherit">/metrics</a></div>
      </header>

      <div class="grid">
        <section class="card">
          <form id="form">
            <div class="row">
              <div class="col"><label>Edad<input name="age" type="number" value="54" min="1" max="120" required/></label></div>
              <div class="col"><label>Sexo<select name="sex"><option value="1">Hombre</option><option value="0">Mujer</option></select></label></div>
            </div>

            <div class="row">
              <div class="col"><label>Dolor torácico (1-4)<input name="chest_pain" type="number" value="3" min="1" max="4" required/></label></div>
              <div class="col"><label>Presión arterial (reposo)<input name="rest_blood_pressure" type="number" value="130" min="50" max="250" required/></label></div>
            </div>

            <div class="row">
              <div class="col"><label>Colesterol<input name="cholesterol" type="number" value="250" min="100" max="600" required/></label></div>
              <div class="col"><label>Glucemia en ayunas<select name="fasting_blood_sugar"><option value="0">0</option><option value="1">1</option></select></label></div>
            </div>

            <div class="row">
              <div class="col"><label>ECG en reposo<select name="rest_ecg"><option value="0">0</option><option value="1">1</option><option value="2">2</option></select></label></div>
              <div class="col"><label>Frecuencia cardíaca máxima<input name="max_heart_rate" type="number" value="150" min="60" max="220" required/></label></div>
            </div>

            <div class="row">
              <div class="col"><label>Angina inducida por ejercicio<select name="exercise_angina"><option value="0">0</option><option value="1">1</option></select></label></div>
              <div class="col"><label>Depresión ST (`oldpeak`)<input name="oldpeak" step="0.1" type="number" value="1.2" min="0" max="10" required/></label></div>
            </div>

            <div class="row">
              <div class="col"><label>Pendiente (`slope`)<select name="slope"><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></label></div>
              <div class="col"><label>Vasos (`vessels`)<input name="vessels" type="number" value="0" min="0" max="3" required/></label></div>
            </div>

            <label>Thal<select name="thal"><option value="3">3</option><option value="6">6</option><option value="7">7</option></select></label>

            <div class="controls">
              <button id="btn" class="small">Predecir</button>
              <button id="batch" type="button" class="small secondary">Predecir x10</button>
              <button id="load" type="button" class="small secondary">Cargar recientes</button>
              <span class="muted" id="status">—</span>
            </div>
          </form>

          <h3 style="margin-top:12px">Último resultado</h3>
          <div id="resultCard" style="display:block;">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
              <div>
                <div id="predLabel" style="font-size:20px;font-weight:600">—</div>
                <div class="muted" style="font-size:13px;margin-top:4px">Predicción</div>
              </div>
              <div style="text-align:right">
                <div id="riskBadge" style="display:inline-block;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,0.04);color:var(--muted)">—</div>
                <div class="muted" style="font-size:12px;margin-top:6px">Riesgo</div>
              </div>
            </div>

            <div style="margin-top:12px">
              <div class="muted" style="font-size:13px">Confianza</div>
              <div style="background:rgba(255,255,255,0.04);border-radius:8px;overflow:hidden;margin-top:6px">
                <div id="confidenceBar" style="height:14px;width:0%;background:var(--success);transition:width .5s"></div>
              </div>
              <div id="confidenceText" class="muted" style="margin-top:6px;font-size:13px">—</div>
            </div>

            <div style="margin-top:12px">
              <div class="muted" style="font-size:13px">Probabilidades</div>
              <ul id="probsList" style="margin:6px 0 0 14px;padding:0;font-size:13px;color:#cfe6ff"></ul>
            </div>
          </div>
        </section>

        <aside class="card">
          <h3 style="margin-top:0">Historial (últimos 25)</h3>
          <div style="max-height:540px;overflow:auto;margin-top:8px">
            <table id="history"><thead><tr><th>#</th><th>ts</th><th>pred</th><th>conf</th><th>input</th></tr></thead><tbody></tbody></table>
          </div>
        </aside>
      </div>
    </div>

    <script>
      const formulario = document.getElementById('form');
      const estado = document.getElementById('status');
      const cuerpoHistorial = document.querySelector('#history tbody');
      const etiquetaPred = document.getElementById('predLabel');
      const barraConfianza = document.getElementById('confidenceBar');
      const textoConfianza = document.getElementById('confidenceText');
      const insigniaRiesgo = document.getElementById('riskBadge');
      const listaProbs = document.getElementById('probsList');
      const CLAVE_HISTORIAL = 'heart_disease_recent_predictions';

      // Convierte el formulario a JSON con tipos numéricos
      function formAJson(form){
        const datos = Object.fromEntries(new FormData(form).entries());
        for (const k in datos){
          const el = form.elements[k];
          if (!el) continue;
          if (el.type==='number' || el.type==='range') datos[k]=Number(datos[k]);
        }
        return datos;
      }

      // Muestra el resultado de la predicción en la UI
      function mostrarResultado(respuesta){
        // Etiqueta de predicción
        etiquetaPred.textContent = respuesta.prediction_label || respuesta.prediction || '—';
        // Confianza
        const confianza = Math.round((respuesta.confidence||0) * 100);
        barraConfianza.style.width = confianza + '%';
        textoConfianza.textContent = `${confianza}%`;
        // Color de la insignia de riesgo
        const riesgo = (respuesta.risk_level||'').toLowerCase();
        let bg = 'rgba(255,255,255,0.04)';
        if(riesgo.includes('high')) bg = 'rgba(239,68,68,0.9)';
        else if(riesgo.includes('medium')) bg = 'rgba(250,204,21,0.9)';
        else if(riesgo.includes('low')) bg = 'rgba(16,185,129,0.9)';
        insigniaRiesgo.style.background = bg;
        insigniaRiesgo.style.color = '#051018';
        insigniaRiesgo.textContent = respuesta.risk_level || '—';

        // Probabilidades
        listaProbs.innerHTML = '';
        if(respuesta.probabilities){
          for(const k of Object.keys(respuesta.probabilities)){
            const li = document.createElement('li');
            const pct = Math.round(respuesta.probabilities[k]*100);
            li.textContent = `${k}: ${pct}%`;
            listaProbs.appendChild(li);
          }
        }
      }

      // Guarda la predicción en el historial local
      function guardarEnHistorial(payload, respuesta){
        const historial = JSON.parse(localStorage.getItem(CLAVE_HISTORIAL) || '[]');
        historial.unshift({
          id: Date.now(),
          timestamp: new Date().toLocaleString(),
          prediction_label: respuesta.prediction_label,
          confidence: respuesta.confidence,
          risk_level: respuesta.risk_level,
          input_json: JSON.stringify(payload)
        });
        localStorage.setItem(CLAVE_HISTORIAL, JSON.stringify(historial.slice(0, 25)));
        mostrarHistorial();
      }

      // Renderiza el historial desde localStorage (maneja JSON corrupto)
      function mostrarHistorial(){
        let raw = localStorage.getItem(CLAVE_HISTORIAL);
        let historial = [];
        if(raw){
          try{
            historial = JSON.parse(raw) || [];
          }catch(err){
            localStorage.removeItem(CLAVE_HISTORIAL);
            historial = [];
            if(typeof estado !== 'undefined' && estado) estado.textContent = 'Historial limpiado (formato inválido)';
          }
        }
        cuerpoHistorial.innerHTML='';
        if(!historial.length){
          const tr = document.createElement('tr');
          tr.innerHTML = '<td colspan="5" class="muted">Aún no hay predicciones guardadas en este navegador</td>';
          cuerpoHistorial.appendChild(tr);
          return;
        }
        historial.forEach((p)=>{
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${p.id}</td>
            <td style="max-width:140px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.timestamp}</td>
            <td>${p.prediction_label || '—'}</td>
            <td>${Number(p.confidence || 0).toFixed(2)}</td>
            <td style="max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.risk_level || '—'}</td>
          `;
          cuerpoHistorial.appendChild(tr);
        });
      }

      // Llama al endpoint /predict del servidor
      async function llamarPrediccion(payload){
        estado.textContent = 'Enviando...';
        try{
          const r = await fetch('/predict', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
          const j = await r.json();
          mostrarResultado(j);
          guardarEnHistorial(payload, j);
          estado.textContent = 'OK';
          return j;
        }catch(e){
          etiquetaPred.textContent = 'Error';
          barraConfianza.style.width = '0%';
          textoConfianza.textContent = '';
          insigniaRiesgo.textContent = '—';
          listaProbs.innerHTML = '';
          estado.textContent = 'Error';
          throw e;
        }
      }

      formulario.addEventListener('submit', async (e)=>{
        e.preventDefault();
        const payload = formAJson(formulario);
        await llamarPrediccion(payload);
      });

      document.getElementById('batch').addEventListener('click', async ()=>{
        const payload = formAJson(formulario);
        const pacientes = Array.from({length:10},()=>payload);
        estado.textContent='Enviando lote...';
        try{
          const r = await fetch('/predict/batch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({patients:pacientes})});
          const j = await r.json();
          etiquetaPred.textContent = `Lote de ${j.count || 10} predicciones`;
          barraConfianza.style.width = '100%';
          textoConfianza.textContent = `Tiempo total: ${j.total_inference_time_ms ?? '—'} ms`;
          insigniaRiesgo.textContent = 'Lote';
          insigniaRiesgo.style.background = 'rgba(79,70,229,0.9)';
          insigniaRiesgo.style.color = '#051018';
          listaProbs.innerHTML = '<li>Revisa el historial local después del lote</li>';
          estado.textContent='Lote OK';
        }catch(e){
          etiquetaPred.textContent = 'Error';
          barraConfianza.style.width = '0%';
          textoConfianza.textContent = 'Lote no disponible';
          estado.textContent='Error';
        }
      });

      document.getElementById('load').addEventListener('click', ()=>{
        mostrarHistorial();
        estado.textContent='Historial local cargado';
      });

      // Carga automática al abrir la página
      mostrarHistorial();
    </script>
  </body>
</html>
